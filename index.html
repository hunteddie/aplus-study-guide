      el("div", { class: "exam-head" },
        el("h2", null, exam.name + " ", el("span", { class: "num sub" }, exam.code)),
        el("button", { class: "btn small", onclick: () => startQuiz(pick(list, 15), exam.name + " practice") }, "Practice " + exam.name)),
      el("p", { class: "sub", style: "margin: 4px 0 14px" }, "Up to 90 questions in 90 minutes. Pass mark " + exam.pass + " out of 900."),
      DOMAINS.filter(d => d.core === exam.core).map(d => {
        const qs = QUESTIONS.filter(q => q.domain === d.id);
        const done = qs.filter(isLearned).length;
        const going = qs.filter(q => cardOf(q) && !isLearned(q)).length;
        return el("div", { class: "domain" },
          el("div", null,
            el("div", null, d.name),
            el("div", { class: "meta" }, d.weight + "% of the exam · " + done + " learned, " + going + " in progress, " + (qs.length - done - going) + " new")),
          el("button", { class: "btn small", onclick: () => startQuiz(pick(qs, 10), d.name) }, "Practice"),
          el("div", { class: "bar" },
            el("i", { style: "width:" + (done / qs.length * 100) + "%" }),
            el("i", { class: "going", style: "width:" + (going / qs.length * 100) + "%" })));
      }));
  });

  const reset = confirmingReset
    ? el("div", { class: "row" },
        el("span", { class: "sub" }, "Erase all saved progress?"),
        el("button", { class: "btn small", onclick: () => {
          state.cards = {}; state.streak = 0; state.lastDay = null; state.newDay = null; state.newToday = 0;
          state.resetAt = Date.now();
          save(); confirmingReset = false; showHome(); } }, "Yes, erase"),
        el("button", { class: "btn small", onclick: () => { confirmingReset = false; showHome(); } }, "Cancel"))
    : el("button", { class: "link", onclick: () => { confirmingReset = true; showHome(); } }, "Reset progress");

  show(
    el("header", { class: "stack" },
      el("p", { class: "label" }, "CompTIA A+ · V15"),
      el("h1", null, "A+ Study Guide"),
      el("p", { class: "sub" }, QUESTIONS.length + " practice questions across all nine exam domains. Do the daily session and the app brings each question back just before you would forget it.")),
    summary, todayPanel, options, recall, accountPanel(), ...exams,
    el("p", { class: "note" }, "These are original practice questions written for study, not questions from the real exam."),
    (saveNote = el("p", { class: "note" }, saveMessage())),
    reset
  );
}

/* ----- Quiz ----- */
let quiz = null;    // the session in progress
let onKey = null;   // what the keyboard does on the current screen

// One question as it appears in a session. Choices are shuffled; the right one is remembered by its text.
function makeItem(q, retry) {
  return { q, choices: shuffle(q.choices), answer: q.choices[q.correct], picked: null, retry, revealed: false, nextDue: null };
}

function startQuiz(list, title) {
  if (!list.length) return;
  quiz = { title, items: list.map(q => makeItem(q, false)), at: 0 };
  showQuestion();
}

function showQuestion() {
  atHome = false;
  const item = quiz.items[quiz.at], q = item.q, answered = item.picked !== null;
  const last = quiz.at === quiz.items.length - 1;
  const hidden = state.recallFirst && !item.revealed && !answered;

  const choose = choice => {
    if (item.picked !== null) return;
    item.picked = choice;
    const correct = choice === item.answer;
    if (!item.retry) {            // only your first try at a question counts toward the schedule
      grade(q, correct);
      item.nextDue = cardOf(q).due - today();
    }
    // Missed it? Put it back at the end of this session, up to two more times.
    const tries = quiz.items.filter(i => i.q === q).length;
    if (!correct && tries < 3) quiz.items.push(makeItem(q, true));
    showQuestion();
  };
  const next = () => { if (last) showResults(); else { quiz.at++; showQuestion(); } };
  const reveal = () => { item.revealed = true; showQuestion(); };

  const buttons = item.choices.map((choice, i) => {
    let cls = "choice";
    if (answered && choice === item.answer) cls += " right";
    else if (answered && choice === item.picked) cls += " wrong";
    return el("button", { class: cls, disabled: answered, onclick: () => choose(choice) },
      el("span", { class: "key" }, String(i + 1)), el("span", null, choice));
  });

  const right = item.picked === item.answer;
  onKey = e => {
    const n = Number(e.key);
    if (hidden) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); reveal(); } }
    else if (!answered && n >= 1 && n <= item.choices.length) choose(item.choices[n - 1]);
    else if (answered && e.key === "Enter") { e.preventDefault(); next(); }
  };

  show(
    el("div", { class: "row spread" },
      el("p", { class: "label" }, "Question " + (quiz.at + 1) + " of " + quiz.items.length + " · " + domainById(q.domain).name),
      el("button", { class: "link", onclick: showHome }, "Quit")),
    item.retry && el("p", { class: "tag" }, "You missed this one earlier. Try it again."),
    el("p", { class: "question" }, q.text),
    hidden
      ? el("div", { class: "panel stack" },
          el("p", null, "Say your answer out loud or in your head before you look."),
          el("div", { class: "row" }, el("button", { class: "btn primary", onclick: reveal }, "Show the choices")))
      : el("div", { class: "stack" }, buttons),
    answered && el("div", { class: "panel stack" },
      el("p", { class: "verdict " + (right ? "right" : "wrong") }, right ? "Correct" : "Not quite. The answer is: " + item.answer),
      el("p", null, q.explanation),
      item.nextDue !== null && el("p", { class: "sub" }, "You will see this again " + inDays(item.nextDue) + "."),
      learnMore(q.topic)),
    answered && el("div", { class: "row" },
      el("button", { class: "btn primary", onclick: next }, last ? "See results" : "Next question")),
    el("p", { class: "note" }, hidden ? "Keyboard: Enter shows the choices." : "Keyboard: press 1 to 4 to answer, Enter for the next question.")
  );
}

function showResults() {
  atHome = false;
  onKey = null;
  const firsts = quiz.items.filter(i => !i.retry);          // score first tries only
  const right = firsts.filter(i => i.picked === i.answer).length;
  const wrong = firsts.filter(i => i.picked !== i.answer);

  const byDomain = DOMAINS.map(d => {
    const mine = firsts.filter(i => i.q.domain === d.id);
    return mine.length ? { d, total: mine.length, right: mine.filter(i => i.picked === i.answer).length } : null;
  }).filter(Boolean);

  show(
    el("header", { class: "stack" },
      el("p", { class: "label" }, quiz.title + " · finished"),
      el("h1", null, right + " of " + firsts.length + " right on the first try"),
      el("p", { class: "sub" }, wrong.length
        ? "The " + wrong.length + " you missed are scheduled for tomorrow. The rest come back after longer gaps."
        : "Nothing missed. These questions come back after longer gaps to check they have stuck.")),
    byDomain.length > 1 && el("section", { class: "panel" },
      el("h2", null, "By domain"),
      byDomain.map(r => el("div", { class: "domain" },
        el("div", null, r.d.name), el("div", { class: "num" }, r.right + " / " + r.total),
        el("div", { class: "bar" }, el("i", { style: "width:" + (r.right / r.total * 100) + "%" }))))),
    wrong.length > 0 && el("section", { class: "panel" },
      el("h2", null, "Study these before tomorrow"),
      wrong.map(i => el("div", { class: "missed stack" },
        el("div", null, i.q.text),
        el("div", { class: "ans" }, i.answer),
        el("div", { class: "sub" }, i.q.explanation),
        learnMore(i.q.topic)))),
    el("div", { class: "row" }, el("button", { class: "btn primary", onclick: showHome }, "Back to home"))
  );
}

/* ----- Study links and the explanation of the method ----- */
function showResources() {
  atHome = false;
  onKey = null;
  show(
    el("div", { class: "row spread" },
      el("p", { class: "label" }, "Study links"),
      el("button", { class: "link", onclick: showHome }, "Back to home")),
    el("h1", null, "Where to learn the material"),
    el("p", { class: "sub" }, "This app is for remembering. Use these to learn a topic properly the first time, then let the daily session keep it in your head."),
    RESOURCES.map(group => el("section", { class: "panel" },
      el("h2", null, group.group),
      group.items.map(item => el("div", { class: "missed stack" },
        link(item[0], item[1]),
        el("div", { class: "sub" }, item[2]))))),
    el("p", { class: "note" }, "After each question you answer, the app also offers a Wikipedia and a YouTube search for that question's topic.")
  );
}

function showHow() {
  atHome = false;
  onKey = null;
  const steps = [
    ["Do the daily session", "It holds every question that is due, plus " + NEW_PER_DAY + " new ones. It takes about ten minutes."],
    ["Missed questions come back fast", "A miss returns later in the same session, and again tomorrow."],
    ["Right answers come back slowly", "Each time you get a due question right, the gap grows: 1 day, then 3, 7, 14 and 30."],
    ["Learned means it lasted", "A question counts as learned after you have remembered it on three separate days."]
  ];
  show(
    el("div", { class: "row spread" },
      el("p", { class: "label" }, "How this works"),
      el("button", { class: "link", onclick: showHome }, "Back to home")),
    el("h1", null, "Remembering it tomorrow, not just today"),
    el("p", { class: "sub" }, "Getting an answer right five minutes after seeing it proves very little. Memory sticks when you have to pull the answer back out after a gap, just as it is starting to fade. This app schedules that for you."),
    el("section", { class: "panel" }, steps.map(s => el("div", { class: "missed stack" },
      el("div", { class: "strong" }, s[0]), el("div", { class: "sub" }, s[1])))),
    el("p", { class: "sub" }, "Two habits make the biggest difference: come back every day, even for five minutes, and turn on the option that hides the choices so you recall the answer instead of recognizing it.")
  );
}

/* ----- Flashcards ----- */
let deckOrder = [], deckName = null, flipped = false;

function showCards(name, at) {
  atHome = false;
  if (name !== deckName) {   // a different deck was chosen, so build and shuffle it
    deckName = name;
    deckOrder = shuffle(CARDS.filter(c => name === "All" || c[0] === name));
    at = 0;
    flipped = false;
  }
  const card = deckOrder[at];
  const go = step => { flipped = false; showCards(name, (at + step + deckOrder.length) % deckOrder.length); };
  const flip = () => { flipped = !flipped; showCards(name, at); };

  onKey = e => {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
    else if (e.key === "ArrowRight") go(1);
    else if (e.key === "ArrowLeft") go(-1);
  };

  show(
    el("div", { class: "row spread" },
      el("p", { class: "label" }, "Flashcards · " + (at + 1) + " of " + deckOrder.length),
      el("button", { class: "link", onclick: showHome }, "Back to home")),
    el("div", { class: "row" }, ["All", "Ports", "Acronyms", "Commands"].map(n =>
      el("button", { class: "chip" + (n === name ? " on" : ""), onclick: () => showCards(n, 0) }, n))),
    el("button", { class: "card" + (flipped ? " back" : ""), onclick: flip },
      el("span", { class: "label" }, flipped ? "Answer" : card[0]),
      el("span", { class: "face" + (flipped ? "" : " num") }, flipped ? card[2] : card[1])),
    el("div", { class: "row" },
      el("button", { class: "btn", onclick: () => go(-1) }, "Previous"),
      el("button", { class: "btn primary", onclick: flip }, flipped ? "Show front" : "Show answer"),
      el("button", { class: "btn", onclick: () => go(1) }, "Next")),
    el("p", { class: "note" }, "Keyboard: Space flips the card, the arrow keys move between cards.")
  );
}

document.addEventListener("keydown", e => { if (onKey) onKey(e); });

// Start on the home screen, then connect to the account in the background.
showHome();
cloudStart();
</script>
