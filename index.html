add("thr", "Installing a phone app from outside the official app store is called what?", ["Jailbreaking", "Side loading", "Rooting", "Tethering"], 1, "Side loading skips the app store's review, so malicious apps get in more easily. Jailbreaking and rooting remove the operating system's own restrictions.", "Sideloading");
add("thr", "A cloud storage bucket holding customer records is set to allow public access. What type of vulnerability is this?", ["Misconfiguration", "Zero-day", "Firmware", "Side loading"], 0, "Misconfiguration is one of the most common causes of cloud data breaches. Secure baselines and automated configuration checks catch it.", "Cloud misconfiguration");

// 3. Security Architecture
add("arch", "In the cloud shared responsibility model for IaaS, who patches the guest operating system?", ["The cloud provider", "The customer", "Both equally", "The hypervisor vendor"], 1, "With IaaS the provider secures the physical data center and the hypervisor. The customer is responsible for everything they install, including the operating system, applications and data.", "Shared responsibility model");
add("arch", "Defining servers and networks in configuration files so they deploy the same way every time is called what?", ["Infrastructure as code", "Serverless", "Microservices", "SD-WAN"], 0, "Infrastructure as code makes builds repeatable and reviewable, and it reduces configuration drift and human error.", "Infrastructure as code");
add("arch", "Why are industrial control systems (ICS/SCADA) often hard to secure?", ["They always run the newest operating systems", "They often run legacy systems that cannot easily be patched and must stay available", "They never connect to any network", "They always run in the public cloud"], 1, "Taking a plant or utility offline to patch is costly or dangerous, so these systems are often isolated or segmented instead.", "SCADA security");
add("arch", "A system is physically isolated, with no network connection to any other network. What is this?", ["Air-gapped", "A screened subnet", "A VLAN", "A jump server"], 0, "An air gap is physical separation. Data can still cross it on removable media, so USB controls still matter.", "Air gap networking");
add("arch", "Where should a company place its public-facing web server?", ["On the internal LAN", "In a screened subnet (DMZ)", "On the domain controller", "In the management VLAN"], 1, "A screened subnet sits between the internet and the internal network, so a compromised public server does not give direct access to internal systems.", "Screened subnet DMZ");
add("arch", "Administrators must connect to one hardened server first, then from it reach the sensitive servers. What is that first server?", ["Jump server", "Proxy server", "Load balancer", "Honeypot"], 0, "A jump server (or jump box) is a single, tightly controlled and heavily logged entry point into a secure zone.", "Jump server");
add("arch", "A firewall fails, and its configuration blocks all traffic until it is fixed. Which failure mode is this?", ["Fail-open", "Fail-closed", "Active/passive", "Inline tap"], 1, "Fail-closed keeps things secure but sacrifices availability. Fail-open keeps traffic flowing but sacrifices security.", "Fail-safe");
add("arch", "Which device inspects HTTP traffic to block attacks such as SQL injection and XSS against a web application?", ["Web application firewall", "Layer 4 firewall", "Load balancer", "Network tap"], 0, "A WAF works at the application layer and understands web requests. A layer 4 firewall only sees IP addresses and ports.", "Web application firewall");
add("arch", "Which sensor deployment can actively block malicious traffic as it passes through?", ["An IDS on a SPAN port", "An inline IPS", "A network tap with an IDS", "A SIEM"], 1, "Only an inline device sits in the traffic path, so only it can drop packets. Passive sensors on a SPAN port or tap can alert but cannot block.", "Intrusion prevention system");
add("arch", "Which IPsec protocol encrypts the packet's payload?", ["AH", "ESP", "IKE", "GRE"], 1, "ESP (Encapsulating Security Payload) gives confidentiality plus integrity. AH (Authentication Header) gives integrity and authentication but no encryption. IKE negotiates the keys.", "Encapsulating Security Payload");
add("arch", "Which standard requires a device to authenticate before it gets network access on a switch port?", ["802.1X", "802.11ac", "802.3af", "802.1Q"], 0, "802.1X is port-based network access control, usually backed by a RADIUS server. 802.1Q is VLAN tagging, 802.3af is Power over Ethernet and 802.11ac is Wi-Fi.", "IEEE 802.1X");
add("arch", "Encrypting a laptop's entire drive protects data in which state?", ["In transit", "At rest", "In use", "In motion"], 1, "Full-disk encryption protects stored data if the device is lost or stolen. TLS protects data in transit.", "Data at rest");
add("arch", "A company must keep EU customers' data in EU data centers because of local law. What concept is this?", ["Data sovereignty", "Data masking", "Tokenization", "Data in use"], 0, "Data sovereignty means data is subject to the laws of the country where it is stored, which drives decisions about where to store it.", "Data sovereignty");
add("arch", "A help desk screen shows only the last four digits of a customer's card number. What technique is this?", ["Data masking", "Hashing", "Encryption at rest", "Geofencing"], 0, "Masking hides part of the data so staff see only what they need. The full value still exists in the system behind the screen.", "Data masking");
add("arch", "Which recovery site has power, network and equipment ready, and can take over within minutes or hours?", ["Hot site", "Warm site", "Cold site", "Mobile site"], 0, "A hot site is the fastest and most expensive. A warm site has some equipment and needs time to finish setup. A cold site is little more than space and power.", "Hot site disaster recovery");
add("arch", "Which backup type copies only what changed since the last backup of any kind, so backups are fastest but restores are slowest?", ["Full", "Differential", "Incremental", "Snapshot"], 2, "Restoring from incrementals needs the last full backup plus every incremental since. A differential needs only the full backup plus the latest differential.", "Incremental backup");
add("arch", "Two firewalls are paired. One handles all traffic and the other takes over only if the first fails. What setup is this?", ["Active/passive", "Active/active", "Round-robin load balancing", "Cold standby"], 0, "In active/passive, the standby unit waits idle. In active/active, both share the load and either can carry it alone.", "High availability active passive");
add("arch", "Team members talk through how they would respond to a ransomware scenario in a conference room, without touching any systems. What kind of test is this?", ["Tabletop exercise", "Failover test", "Simulation", "Parallel processing"], 0, "A tabletop exercise is a discussion-based walk-through. It is cheap and finds gaps in plans and roles without any risk to production systems.", "Tabletop exercise");
add("arch", "Which device keeps servers running on battery for a short time until a generator starts?", ["UPS", "PDU", "Generator", "Surge protector"], 0, "A UPS bridges the gap of seconds to minutes. A generator supplies long-term power, and a PDU just distributes power within a rack.", "Uninterruptible power supply");

// 4. Security Operations
add("secops", "Which is a standard step when hardening a new server?", ["Disable unused services and close unused ports", "Keep the default admin password for vendor support", "Install every available application", "Turn off logging to save space"], 0, "Hardening shrinks the attack surface. Every service you do not run is one that cannot be attacked.", "System hardening");
add("secops", "A documented standard configuration that every new workstation is built from is called what?", ["Secure baseline", "Risk register", "Playbook", "Change request"], 0, "A secure baseline sets the approved settings. Systems are deployed from it and later checked against it to catch drift.", "Security baseline");
add("secops", "Which wireless security standard replaces the pre-shared key handshake with SAE?", ["WEP", "WPA2-Personal", "WPA3", "WPS"], 2, "WPA3 uses Simultaneous Authentication of Equals (SAE), which resists offline password-guessing attacks against captured handshakes.", "WPA3");
add("secops", "A vulnerability scanner reports a vulnerability that is not actually present. What is this called?", ["False positive", "False negative", "True positive", "Compensating control"], 0, "A false positive is an alarm with nothing behind it. A false negative is worse: a real problem the scan missed.", "False positives and false negatives");
add("secops", "Which system scores the severity of vulnerabilities from 0 to 10?", ["CVE", "CVSS", "SCAP", "STIX"], 1, "CVSS (Common Vulnerability Scoring System) gives the severity score. CVE gives each known vulnerability its ID number.", "Common Vulnerability Scoring System");
add("secops", "Why run a credentialed vulnerability scan instead of a non-credentialed one?", ["It signs in, so it sees missing patches and configuration problems an outside scan cannot", "It is faster and hides from the IDS", "It exploits each vulnerability to prove it", "It needs no permission"], 0, "A credentialed scan looks from the inside, like an administrator, which gives far more accurate results. A non-credentialed scan shows what an outside attacker would see.", "Credentialed vulnerability scan");
add("secops", "A critical legacy system cannot be patched. What is the best approach?", ["Leave it as it is", "Apply compensating controls, such as isolating it on its own network segment", "Turn off all monitoring", "Expose it to the internet"], 1, "When the real fix is not possible, compensating controls reduce the risk another way: segmentation, strict access rules and extra monitoring.", "Compensating controls");
add("secops", "Which tool collects logs from many sources, correlates events and raises alerts?", ["SIEM", "DLP", "NAC", "MDM"], 0, "A SIEM (security information and event management) is the center of a SOC's monitoring. Correlation links events across systems that look harmless on their own.", "Security information and event management");
add("secops", "Which tool runs on each endpoint, records behavior and can isolate an infected host from the network?", ["EDR", "WAF", "HSM", "SPF"], 0, "Endpoint detection and response looks at behavior, not just signatures, and lets responders contain a host remotely.", "Endpoint detection and response");
add("secops", "A system blocks an outgoing email because it contains 20 credit card numbers addressed to someone outside the company. What tool is this?", ["DLP", "IDS", "SOAR", "SIEM"], 0, "Data loss prevention inspects content for sensitive patterns, such as card numbers or SSNs, and blocks it from leaving.", "Data loss prevention");
add("secops", "Which email authentication record lists the mail servers allowed to send email for a domain?", ["SPF", "DKIM", "DMARC", "MX"], 0, "SPF is a DNS TXT record listing approved senders. DKIM adds a digital signature to each message. An MX record says where mail for the domain is delivered.", "Sender Policy Framework");
add("secops", "Which standard tells receiving mail servers what to do with mail that fails SPF and DKIM checks, and sends reports back to the domain owner?", ["DMARC", "SPF", "DKIM", "S/MIME"], 0, "DMARC sets the policy (none, quarantine or reject) and turns on reporting. It builds on SPF and DKIM.", "DMARC");
add("secops", "Which tool raises an alert when critical system files are changed?", ["File integrity monitoring", "Port scanner", "Load balancer", "Proxy server"], 0, "File integrity monitoring compares files against known-good hashes and flags changes, which catches tampering such as rootkits.", "File integrity monitoring");
add("secops", "A user signs in once and can then reach email, HR and the ticketing system without signing in again. What is this?", ["SSO", "MFA", "PAM", "RBAC"], 0, "Single sign-on means one authentication grants access to many applications, which also means that one account needs strong protection.", "Single sign-on");
add("secops", "Which open standard passes authentication assertions in XML between an identity provider and a web application?", ["SAML", "LDAP", "RADIUS", "Kerberos"], 0, "SAML is widely used for federated single sign-on to web apps. LDAP queries directories, and RADIUS handles network access.", "Security Assertion Markup Language");
add("secops", "A photo-printing website asks for permission to read your cloud photos without ever seeing your password. Which protocol does this?", ["OAuth", "SAML", "TACACS+", "LDAP"], 0, "OAuth is for authorization: it gives an app a limited token for specific access. OpenID Connect adds authentication on top of OAuth.", "OAuth");

/* ---------- 5. THE APP ---------- */

/* How the review schedule works (spaced repetition):
   Every question sits in a "box" from 0 to 5. The box decides how long until you see it again.
     - Answer correctly when it is due: it moves up one box, so the gap gets longer.
     - Answer wrongly at any time: it drops to box 0 and comes back tomorrow.
   A question counts as "learned" once it reaches box 3, which means you remembered it
   on at least three separate days, with growing gaps in between. */
const GAP_DAYS = [1, 1, 3, 7, 14, 30];   // days until the next review, for boxes 0 to 5
const LEARNED_BOX = 3;
const NEW_PER_DAY = 10;                  // how many brand-new questions a daily session adds

// Today as a whole number of days, in your local time zone. Used to compare dates simply.
function today() {
  const now = new Date();
  return Math.floor((now.getTime() - now.getTimezoneOffset() * 60000) / 86400000);
}

// Saved state. It is always kept in this browser. On the published page it is also saved to your
// Claude account (see "Saving to your Claude account" below), so it follows you between devices.
const STORE_KEY = "aplus-study-progress";
let state = { v: 2, track: "secplus", cards: {}, streak: 0, lastDay: null, newDay: null, newToday: 0, recallFirst: false, updated: 0, resetAt: 0 };
try {
  const raw = JSON.parse(localStorage.getItem(STORE_KEY));
  if (raw && raw.v === 2) {
    state = Object.assign(state, raw);
  } else if (raw) {
    // Progress from the first version of the app: bring every answered question in as due now.
    for (const id in raw) state.cards[id] = { box: raw[id] === true ? 1 : 0, due: today(), t: Date.now() };
  }
} catch (e) { /* keep the empty state */ }
function saveLocal() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
}
function save() {
  state.updated = Date.now();
  saveLocal();
  cloudPush();
}

/* ----- Saving to an account -----
   Progress can follow you between devices in two ways, depending on where the app is running:
     - On the page published inside Claude, you are already signed in to Claude, so the page asks
       Claude who is viewing and keeps one private document of progress for that person.
     - In the installable web app, you sign in with an email and password. Accounts and progress
       are kept in a Supabase project (see "Accounts for the installable web app" below).
   Opened straight from a folder, with neither, it saves in the browser only.
   Either way the rest of the app only talks to "cloudDoc", which has two actions: get and set. */
let cloudDoc = null;          // where this person's progress lives, once connected
let cloudState = "local";     // "local", "synced" or "error"
let pushTimer = null;
let atHome = false;
let saveNote = null;          // the line of text on the home screen that reports where progress is saved

function saveMessage() {
  if (sb) {
    if (cloudState === "synced") return "Progress is saved to your account, so it is the same on every device where you sign in.";
    if (cloudState === "error") return "Could not reach your account just now. Progress is saved on this device and will sync when you are back online.";
    return "Progress is saved on this device only. Sign in to keep it on every device.";
  }
  if (cloudState === "synced") return "Progress is saved to your Claude account, so it is the same on every device where you open this page.";
  if (cloudState === "error") return "Could not reach your Claude account just now. Progress is saved in this browser and will sync when the page reconnects.";
  return "Progress is saved in this browser only.";
}
function setCloud(value) {
  cloudState = value;
  if (saveNote) saveNote.textContent = saveMessage();
}

// Combine progress from this browser with progress from the account: for each question keep
// whichever copy was answered most recently, and drop anything older than the last reset.
function mergeState(local, remote) {
  const newer = (remote.updated || 0) > (local.updated || 0) ? remote : local;
  const merged = Object.assign({}, local, newer, { cards: {} });
  merged.resetAt = Math.max(local.resetAt || 0, remote.resetAt || 0);
  const ids = new Set(Object.keys(local.cards || {}).concat(Object.keys(remote.cards || {})));
  ids.forEach(id => {
    const a = (local.cards || {})[id], b = (remote.cards || {})[id];
    const best = !a ? b : !b ? a : ((b.t || 0) > (a.t || 0) ? b : a);
    if ((best.t || 0) >= merged.resetAt) merged.cards[id] = { box: best.box, due: best.due, t: best.t || 0 };
  });
  return merged;
}

function cloudPush() {
  if (!cloudDoc) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => {       // wait a moment so several quick answers become one save
    cloudDoc.set(JSON.parse(JSON.stringify(state))).then(() => setCloud("synced"), () => setCloud("error"));
  }, 1500);
}

async function cloudPull() {
  if (!cloudDoc) return;
  try {
    const snap = await cloudDoc.get();
    const remote = snap.exists ? snap.data() : null;
    if (remote && remote.v === 2) {
      const before = JSON.stringify(state.cards);
      state = mergeState(state, JSON.parse(JSON.stringify(remote)));
      saveLocal();
      if (JSON.stringify(state.cards) !== JSON.stringify(remote.cards || {})) cloudPush();
      if (atHome && JSON.stringify(state.cards) !== before) showHome();
    } else if (Object.keys(state.cards).length) {
      cloudPush();                     // first time on this account: upload what this browser has
    }
    setCloud("synced");
  } catch (e) { setCloud("error"); }
}

async function cloudStart() {
  // Pick up progress made on another device whenever you come back to the app.
  document.addEventListener("visibilitychange", () => { if (!document.hidden) cloudPull(); });
  try {
    const config = window.APP_CONFIG || {};
    if (window.supabase && config.supabaseUrl && config.supabaseKey) {
      supabaseStart(config);
    } else if (window.claude && window.claude.use) {
      const db = await window.claude.use("db");
      const user = await window.claude.use("user");
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      cloudDoc = db.doc("data/users/" + id + "/progress");
      await cloudPull();
    }
  } catch (e) { setCloud("error"); }
}

/* ----- Accounts for the installable web app (Supabase) -----
   Supabase provides the sign-in and a database. This app uses one table, "progress", with one row
   per person. The database itself enforces that a signed-in person can only read and write their
   own row (row level security, set up in supabase.sql), so the key in config.js is safe to publish. */
let sb = null;            // the Supabase client, when config.js is filled in
let account = null;       // the signed-in email address, or null
let accountMsg = "";      // feedback shown under the sign-in form
let draftEmail = "";

function supabaseStart(config) {
  sb = window.supabase.createClient(config.supabaseUrl, config.supabaseKey);
  // Runs at start-up with any saved session, and again on every sign-in and sign-out.
  sb.auth.onAuthStateChange((event, session) => { setTimeout(() => useSession(session), 0); });
  if (atHome) showHome();
}

function useSession(session) {
  const user = session ? session.user : null;
  const before = account;
  account = user ? user.email : null;
  if (user) {
    const mine = () => sb.from("progress");
    cloudDoc = {
      get: async () => {
        const r = await mine().select("data").eq("user_id", user.id).maybeSingle();
        if (r.error) throw r.error;
        return { exists: !!r.data, data: () => (r.data ? r.data.data : undefined) };
      },
      set: async data => {
        const r = await mine().upsert({ user_id: user.id, data, updated_at: new Date().toISOString() });
        if (r.error) throw r.error;
      }
    };
    if (before !== account) cloudPull();
  } else {
    cloudDoc = null;
    setCloud("local");
  }
  if (before !== account && atHome) showHome();
}

async function signIn(create) {
  const email = document.getElementById("acct-email").value.trim();
  const password = document.getElementById("acct-pass").value;
  draftEmail = email;
  if (!email || password.length < 8) { accountMsg = "Enter your email and a password of at least 8 characters."; showHome(); return; }
  accountMsg = create ? "Creating your account..." : "Signing in...";
  showHome();
  try {
    const result = create
      ? await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } })
      : await sb.auth.signInWithPassword({ email, password });
    if (result.error) accountMsg = result.error.message;
    else if (create && !result.data.session) accountMsg = "Almost done. Open the confirmation email we sent to " + email + ", tap the link, then come back here and sign in.";
    else accountMsg = "";
  } catch (e) { accountMsg = "Could not reach the sign-in service. Check your connection and try again."; }
  if (atHome) showHome();
}

function accountPanel() {
  if (!sb) return null;
  if (account) {
    return el("section", { class: "panel row spread" },
      el("div", null, el("div", { class: "label" }, "Signed in"), el("div", { class: "wrap" }, account)),
      el("button", { class: "btn small", onclick: () => { accountMsg = ""; sb.auth.signOut(); } }, "Sign out"));
  }
  return el("section", { class: "panel" },
    el("form", { class: "stack", onsubmit: e => { e.preventDefault(); signIn(false); } },
      el("h2", null, "Sign in to save your progress"),
      el("p", { class: "sub" }, "With an account, your progress is the same on your phone and your computer."),
      el("label", { class: "field" }, el("span", null, "Email"),
        el("input", { id: "acct-email", type: "email", autocomplete: "email", required: true, value: draftEmail })),
      el("label", { class: "field" }, el("span", null, "Password"),
        el("input", { id: "acct-pass", type: "password", autocomplete: "current-password", required: true, minlength: "8" })),
      el("div", { class: "row" },
        el("button", { class: "btn primary", type: "submit" }, "Sign in"),
        el("button", { class: "btn", type: "button", onclick: () => signIn(true) }, "Create account")),
      accountMsg && el("p", { class: "sub", role: "status" }, accountMsg)));
}

const cardOf    = q => state.cards[q.id];
const isNew     = q => !cardOf(q);
const isDue     = q => !!cardOf(q) && cardOf(q).due <= today();
const isLearned = q => !!cardOf(q) && cardOf(q).box >= LEARNED_BOX;
const newLeftToday = () => Math.max(0, NEW_PER_DAY - (state.newDay === today() ? state.newToday : 0));
const streakNow = () => (state.lastDay !== null && state.lastDay >= today() - 1) ? state.streak : 0;

// Record an answer and schedule the question's next review.
function grade(q, correct) {
  const t = today();
  const card = cardOf(q);

  if (!card) {
    if (state.newDay !== t) { state.newDay = t; state.newToday = 0; }
    state.newToday++;
    state.cards[q.id] = { box: correct ? 1 : 0, due: t + 1, t: Date.now() };
  } else if (!correct) {
    card.box = 0;
    card.due = t + 1;
    card.t = Date.now();
  } else if (card.due <= t) {
    card.box = Math.min(card.box + 1, GAP_DAYS.length - 1);
    card.due = t + GAP_DAYS[card.box];
    card.t = Date.now();
  }
  // A correct answer before the question is due changes nothing: practicing early is fine,
  // but it does not prove you remembered it after the gap.

  if (state.lastDay !== t) {
    state.streak = state.lastDay === t - 1 ? state.streak + 1 : 1;
    state.lastDay = t;
  }
  save();
}

function inDays(n) { return n <= 0 ? "today" : n === 1 ? "tomorrow" : "in " + n + " days"; }

const app = document.getElementById("app");

// Small helper that builds an HTML element: el("p", { class: "sub" }, "text")
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const key in (attrs || {})) {
    const value = attrs[key];
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (key === "style") node.style.cssText = value;
    else if (value === true) node.setAttribute(key, "");
    else if (value !== false && value != null) node.setAttribute(key, value);
  }
  children.flat().forEach(child => {
    if (child == null || child === false) return;
    node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
  });
  return node;
}
function show(...nodes) { app.replaceChildren(...nodes.flat().filter(Boolean)); window.scrollTo(0, 0); }
function shuffle(list) {
  const copy = list.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}
const domainById = id => DOMAINS.find(d => d.id === id);
const inCore = core => QUESTIONS.filter(q => domainById(q.domain).core === core);
// The track being studied (Security+ or A+), and only that track's questions.
const trackId = () => TRACKS[state.track] ? state.track : "secplus";
const track = () => TRACKS[trackId()];
const examsNow = () => EXAMS.filter(e => e.track === trackId());
const studyQs = () => QUESTIONS.filter(q => examsNow().some(e => e.core === domainById(q.domain).core));
function switchTrack(id) {
  if (id === trackId()) return;
  state.track = id;
  deckName = null;             // rebuild the flashcard deck for the new track
  save();
  showHome();
}
const link = (text, href) => el("a", { href, target: "_blank", rel: "noopener" }, text);

// Two links for digging deeper into a question's topic. Both open a search, so they always work.
function learnMore(topic) {
  return el("div", { class: "more" },
    el("span", { class: "label" }, "Learn more: " + topic),
    el("div", { class: "row" },
      link("Read about it on Wikipedia", "https://en.wikipedia.org/w/index.php?search=" + encodeURIComponent(topic)),
      link("Find a video on YouTube", "https://www.youtube.com/results?search_query=" + encodeURIComponent(track().search + " " + topic))));
}

// Today's session: everything that is due, then a few new questions.
function todaysSession() {
  const due = shuffle(studyQs().filter(isDue));
  const fresh = shuffle(studyQs().filter(isNew)).slice(0, newLeftToday());
  return { due, fresh, list: due.concat(fresh) };
}

// Practice by topic: due questions first, then new ones, then the rest.
function pick(list, limit) {
  const due   = shuffle(list.filter(isDue));
  const fresh = shuffle(list.filter(isNew));
  const rest  = shuffle(list.filter(q => !isNew(q) && !isDue(q)));
  return shuffle(due.concat(fresh, rest).slice(0, limit));
}

/* ----- Home screen ----- */
let confirmingReset = false;

function showHome() {
  onKey = null;
  atHome = true;
  const session = todaysSession();
  const pool = studyQs();
  const learned = pool.filter(isLearned).length;
  const streak = streakNow();
  const freshLeft = pool.filter(isNew).length;

  // Work out when the next review falls due, for the "all caught up" message.
  const upcoming = pool.filter(q => cardOf(q) && cardOf(q).due > today()).map(q => cardOf(q).due);
  const nextDue = upcoming.length ? Math.min(...upcoming) : null;

  const summary = el("div", { class: "panel summary" },
    el("div", null, el("b", null, String(session.due.length)), el("span", { class: "sub" }, "due for review")),
    el("div", null, el("b", null, learned + "/" + pool.length), el("span", { class: "sub" }, "learned")),
    el("div", null, el("b", null, String(streak)), el("span", { class: "sub" }, streak === 1 ? "day in a row" : "days in a row"))
  );

  let todayPanel;
  if (session.list.length) {
    todayPanel = el("section", { class: "panel stack" },
      el("h2", null, "Today's session"),
      el("p", { class: "sub" }, session.due.length + " to review and " + session.fresh.length + " new. Anything you miss comes back later in the session, and again tomorrow."),
      el("div", { class: "row" },
        el("button", { class: "btn primary", onclick: () => startQuiz(session.list, "Today's session") }, "Start, " + session.list.length + " questions")));
  } else {
    todayPanel = el("section", { class: "panel stack" },
      el("h2", null, "You are done for today"),
      el("p", { class: "sub" }, nextDue !== null
        ? "Your next review is " + inDays(nextDue - today()) + ", with " + upcoming.filter(d => d === nextDue).length + " questions. Coming back then is what moves them into long-term memory."
        : "Nothing is scheduled yet."),
      freshLeft > 0 && el("div", { class: "row" },
        el("button", { class: "btn", onclick: () => startQuiz(shuffle(pool.filter(isNew)).slice(0, NEW_PER_DAY), "Extra new questions") }, "Learn " + Math.min(NEW_PER_DAY, freshLeft) + " more new questions")));
  }

  const options = el("div", { class: "row" },
    el("button", { class: "btn", onclick: () => showCards("All", 0) }, "Flashcards"),
    el("button", { class: "btn", onclick: showResources }, "Study links"),
    el("button", { class: "btn", onclick: showHow }, "How this works"));

  const recall = el("label", { class: "check" },
    el("input", { type: "checkbox", id: "recall-first", checked: state.recallFirst,
      onchange: e => { state.recallFirst = e.target.checked; save(); } }),
    el("span", null, "Hide the choices until I have thought of an answer ",
      el("span", { class: "sub" }, "(harder, and better for memory)")));

  const exams = examsNow().map(exam => {
    const list = inCore(exam.core);
    return el("section", { class: "panel" },
      el("div", { class: "exam-head" },
        el("h2", null, exam.name + " ", el("span", { class: "num sub" }, exam.code)),
        el("button", { class: "btn small", onclick: () => startQuiz(pick(list, 15), exam.name + " practice") }, "Practice " + exam.name)),
      el("p", { class: "sub", style: "margin: 4px 0 14px" }, "Up to 90 questions in 90 minutes. Pass mark " + exam.pass + " out of 900."),
      DOMAINS.filter(d => d.core === exam.core).map(d => {
        const qs = QUESTIONS.filter(q => q.domain === d.id);
        const done = qs.filter(isLearned).length;
        const going = qs.filter(q => cardOf(q) && !isLearned(q)).length;
        return el("div", { class: "domain" },
          el("div", null,
            el("div", null, d.name),
            el("div", { class: "meta" }, d.weight + "% of the exam · " + done + " learned, " + going + " in progress, " + (qs.length - done - going) + " new")),
          el("button", { class: "btn small", onclick: () => startQuiz(pick(qs, 10), d.name) }, "Practice"),
          el("div", { class: "bar" },
            el("i", { style: "width:" + (done / qs.length * 100) + "%" }),
            el("i", { class: "going", style: "width:" + (going / qs.length * 100) + "%" })));
      }));
  });

  const reset = confirmingReset
    ? el("div", { class: "row" },
        el("span", { class: "sub" }, "Erase all saved progress, for both A+ and Security+?"),
        el("button", { class: "btn small", onclick: () => {
          state.cards = {}; state.streak = 0; state.lastDay = null; state.newDay = null; state.newToday = 0;
          state.resetAt = Date.now();
          save(); confirmingReset = false; showHome(); } }, "Yes, erase"),
        el("button", { class: "btn small", onclick: () => { confirmingReset = false; showHome(); } }, "Cancel"))
    : el("button", { class: "link", onclick: () => { confirmingReset = true; showHome(); } }, "Reset progress");

  const nDomains = DOMAINS.filter(d => examsNow().some(e => e.core === d.core)).length;
  const switcher = el("div", { class: "row", role: "group", "aria-label": "Exam to study" },
    el("span", { class: "label" }, "Studying"),
    Object.keys(TRACKS).map(id => el("button", {
      class: "chip" + (id === trackId() ? " on" : ""), "aria-pressed": String(id === trackId()),
      onclick: () => switchTrack(id) }, TRACKS[id].label)));
  document.title = track().title;

  show(
    switcher,
    el("header", { class: "stack" },
      el("p", { class: "label" }, track().tag),
      el("h1", null, track().title),
      el("p", { class: "sub" }, pool.length + " practice questions across all " + nDomains + " exam domains. Do the daily session and the app brings each question back just before you would forget it.")),
    summary, todayPanel, options, recall, accountPanel(), ...exams,
    el("p", { class: "note" }, "These are original practice questions written for study, not questions from the real exam."),
    (saveNote = el("p", { class: "note" }, saveMessage())),
    reset
  );
}

/* ----- Quiz ----- */
let quiz = null;    // the session in progress
let onKey = null;   // what the keyboard does on the current screen

// One question as it appears in a session. Choices are shuffled; the right one is remembered by its text.
function makeItem(q, retry) {
  return { q, choices: shuffle(q.choices), answer: q.choices[q.correct], picked: null, retry, revealed: false, nextDue: null };
}

function startQuiz(list, title) {
  if (!list.length) return;
  quiz = { title, items: list.map(q => makeItem(q, false)), at: 0 };
  showQuestion();
}

function showQuestion() {
  atHome = false;
  const item = quiz.items[quiz.at], q = item.q, answered = item.picked !== null;
  const last = quiz.at === quiz.items.length - 1;
  const hidden = state.recallFirst && !item.revealed && !answered;

  const choose = choice => {
    if (item.picked !== null) return;
    item.picked = choice;
    const correct = choice === item.answer;
    if (!item.retry) {            // only your first try at a question counts toward the schedule
      grade(q, correct);
      item.nextDue = cardOf(q).due - today();
    }
    // Missed it? Put it back at the end of this session, up to two more times.
    const tries = quiz.items.filter(i => i.q === q).length;
    if (!correct && tries < 3) quiz.items.push(makeItem(q, true));
    showQuestion();
  };
  const next = () => { if (last) showResults(); else { quiz.at++; showQuestion(); } };
  const reveal = () => { item.revealed = true; showQuestion(); };

  const buttons = item.choices.map((choice, i) => {
    let cls = "choice";
    if (answered && choice === item.answer) cls += " right";
    else if (answered && choice === item.picked) cls += " wrong";
    return el("button", { class: cls, disabled: answered, onclick: () => choose(choice) },
      el("span", { class: "key" }, String(i + 1)), el("span", null, choice));
  });

  const right = item.picked === item.answer;
  onKey = e => {
    const n = Number(e.key);
    if (hidden) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); reveal(); } }
    else if (!answered && n >= 1 && n <= item.choices.length) choose(item.choices[n - 1]);
    else if (answered && e.key === "Enter") { e.preventDefault(); next(); }
  };

  show(
    el("div", { class: "row spread" },
      el("p", { class: "label" }, "Question " + (quiz.at + 1) + " of " + quiz.items.length + " · " + domainById(q.domain).name),
      el("button", { class: "link", onclick: showHome }, "Quit")),
    item.retry && el("p", { class: "tag" }, "You missed this one earlier. Try it again."),
    el("p", { class: "question" }, q.text),
    hidden
      ? el("div", { class: "panel stack" },
          el("p", null, "Say your answer out loud or in your head before you look."),
          el("div", { class: "row" }, el("button", { class: "btn primary", onclick: reveal }, "Show the choices")))
      : el("div", { class: "stack" }, buttons),
    answered && el("div", { class: "panel stack" },
      el("p", { class: "verdict " + (right ? "right" : "wrong") }, right ? "Correct" : "Not quite. The answer is: " + item.answer),
      el("p", null, q.explanation),
      item.nextDue !== null && el("p", { class: "sub" }, "You will see this again " + inDays(item.nextDue) + "."),
      learnMore(q.topic)),
    answered && el("div", { class: "row" },
      el("button", { class: "btn primary", onclick: next }, last ? "See results" : "Next question")),
    el("p", { class: "note" }, hidden ? "Keyboard: Enter shows the choices." : "Keyboard: press 1 to 4 to answer, Enter for the next question.")
  );
}

function showResults() {
  atHome = false;
  onKey = null;
  const firsts = quiz.items.filter(i => !i.retry);          // score first tries only
  const right = firsts.filter(i => i.picked === i.answer).length;
  const wrong = firsts.filter(i => i.picked !== i.answer);

  const byDomain = DOMAINS.map(d => {
    const mine = firsts.filter(i => i.q.domain === d.id);
    return mine.length ? { d, total: mine.length, right: mine.filter(i => i.picked === i.answer).length } : null;
  }).filter(Boolean);

  show(
    el("header", { class: "stack" },
      el("p", { class: "label" }, quiz.title + " · finished"),
      el("h1", null, right + " of " + firsts.length + " right on the first try"),
      el("p", { class: "sub" }, wrong.length
        ? "The " + wrong.length + " you missed are scheduled for tomorrow. The rest come back after longer gaps."
        : "Nothing missed. These questions come back after longer gaps to check they have stuck.")),
    byDomain.length > 1 && el("section", { class: "panel" },
      el("h2", null, "By domain"),
      byDomain.map(r => el("div", { class: "domain" },
        el("div", null, r.d.name), el("div", { class: "num" }, r.right + " / " + r.total),
        el("div", { class: "bar" }, el("i", { style: "width:" + (r.right / r.total * 100) + "%" }))))),
    wrong.length > 0 && el("section", { class: "panel" },
      el("h2", null, "Study these before tomorrow"),
      wrong.map(i => el("div", { class: "missed stack" },
        el("div", null, i.q.text),
        el("div", { class: "ans" }, i.answer),
        el("div", { class: "sub" }, i.q.explanation),
        learnMore(i.q.topic)))),
    el("div", { class: "row" }, el("button", { class: "btn primary", onclick: showHome }, "Back to home"))
  );
}

/* ----- Study links and the explanation of the method ----- */
function showResources() {
  atHome = false;
  onKey = null;
  show(
    el("div", { class: "row spread" },
      el("p", { class: "label" }, "Study links"),
      el("button", { class: "link", onclick: showHome }, "Back to home")),
    el("h1", null, "Where to learn the material"),
    el("p", { class: "sub" }, "This app is for remembering. Use these to learn a topic properly the first time, then let the daily session keep it in your head."),
    RESOURCES.filter(g => g.track === trackId()).map(group => el("section", { class: "panel" },
      el("h2", null, group.group),
      group.items.map(item => el("div", { class: "missed stack" },
        link(item[0], item[1]),
        el("div", { class: "sub" }, item[2]))))),
    el("p", { class: "note" }, "After each question you answer, the app also offers a Wikipedia and a YouTube search for that question's topic.")
  );
}

function showHow() {
  atHome = false;
  onKey = null;
  const steps = [
    ["Do the daily session", "It holds every question that is due, plus " + NEW_PER_DAY + " new ones. It takes about ten minutes."],
    ["Missed questions come back fast", "A miss returns later in the same session, and again tomorrow."],
    ["Right answers come back slowly", "Each time you get a due question right, the gap grows: 1 day, then 3, 7, 14 and 30."],
    ["Learned means it lasted", "A question counts as learned after you have remembered it on three separate days."]
  ];
  show(
    el("div", { class: "row spread" },
      el("p", { class: "label" }, "How this works"),
      el("button", { class: "link", onclick: showHome }, "Back to home")),
    el("h1", null, "Remembering it tomorrow, not just today"),
    el("p", { class: "sub" }, "Getting an answer right five minutes after seeing it proves very little. Memory sticks when you have to pull the answer back out after a gap, just as it is starting to fade. This app schedules that for you."),
    el("section", { class: "panel" }, steps.map(s => el("div", { class: "missed stack" },
      el("div", { class: "strong" }, s[0]), el("div", { class: "sub" }, s[1])))),
    el("p", { class: "sub" }, "Two habits make the biggest difference: come back every day, even for five minutes, and turn on the option that hides the choices so you recall the answer instead of recognizing it.")
  );
}

/* ----- Flashcards ----- */
let deckOrder = [], deckName = null, flipped = false;

function showCards(name, at) {
  atHome = false;
  if (name !== deckName) {   // a different deck was chosen, so build and shuffle it
    deckName = name;
    deckOrder = shuffle(CARDS.filter(c => name === "All" ? track().decks.includes(c[0]) : c[0] === name));
    at = 0;
    flipped = false;
  }
  const card = deckOrder[at];
  const go = step => { flipped = false; showCards(name, (at + step + deckOrder.length) % deckOrder.length); };
  const flip = () => { flipped = !flipped; showCards(name, at); };

  onKey = e => {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
    else if (e.key === "ArrowRight") go(1);
    else if (e.key === "ArrowLeft") go(-1);
  };

  show(
    el("div", { class: "row spread" },
      el("p", { class: "label" }, "Flashcards · " + (at + 1) + " of " + deckOrder.length),
      el("button", { class: "link", onclick: showHome }, "Back to home")),
    el("div", { class: "row" }, ["All"].concat(track().decks).map(n =>
      el("button", { class: "chip" + (n === name ? " on" : ""), onclick: () => showCards(n, 0) }, n))),
    el("button", { class: "card" + (flipped ? " back" : ""), onclick: flip },
      el("span", { class: "label" }, flipped ? "Answer" : card[0]),
      el("span", { class: "face" + (flipped ? "" : " num") }, flipped ? card[2] : card[1])),
    el("div", { class: "row" },
      el("button", { class: "btn", onclick: () => go(-1) }, "Previous"),
      el("button", { class: "btn primary", onclick: flip }, flipped ? "Show front" : "Show answer"),
      el("button", { class: "btn", onclick: () => go(1) }, "Next")),
    el("p", { class: "note" }, "Keyboard: Space flips the card, the arrow keys move between cards.")
  );
}

document.addEventListener("keydown", e => { if (onKey) onKey(e); });

// Start on the home screen, then connect to the account in the background.
showHome();
cloudStart();
</script>
